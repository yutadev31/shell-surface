[package]
name = "shell-surface"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/yutadev31/shell-surface.git"
license = "MIT"

[dependencies]
memmap2 = { version = "0.9.12", optional = true }
nix = { version = "0.31.3", features = ["poll"], optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }
x11rb = { version = "0.14.0", optional = true }
xkbcommon = { version = "0.9.0", optional = true }

[features]
default = ["wayland", "x11"]
wayland = [
  "dep:memmap2",
  "dep:nix",
  "dep:tempfile",
  "dep:wayland-client",
  "dep:wayland-protocols-wlr",
  "dep:xkbcommon",
]
x11 = ["dep:x11rb"]
